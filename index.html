<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DialFactory V1</title>

  <!-- PWA 已于 2026-11-18 回滚（性能回退），manifest / 图标不再引入 -->

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/flow.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-container">
    <!-- Navigation -->
    <div id="nav-container"></div>

    <!-- Page Content -->
    <main id="page-container" class="page-content">
      <div class="skeleton-page">
        <div class="skeleton-header">
          <div class="skeleton-line skeleton-line-xl"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-line skeleton-line-lg"></div>
          <div class="skeleton-line skeleton-line-sm"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-line skeleton-line-lg"></div>
          <div class="skeleton-line skeleton-line-sm"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Import Map：把 @supabase/supabase-js 指向本地 vendor。
       原先指向 https://esm.sh（首屏唯一的第三方跨境依赖，国内经常卡住整页加载）。
       本地化后首屏不再有任何第三方请求；版本与来源见 js/vendor/README.md。 -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "./js/vendor/supabase.min.js"
    }
  }
  </script>

  <!-- JS Infrastructure (IIFE pattern, order matters) -->
  <script src="js/config.js"></script>
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/router.js"></script>
  <script src="js/components/skeleton.js"></script>
  <script src="js/components/nav-bar.js"></script>

  <!-- Error display if module fails -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.target.tagName === 'SCRIPT') {
        document.getElementById('page-container').innerHTML =
          '<div class="card" style="text-align:center;margin:48px;"><p style="font-size:2rem;">⚠️</p><p style="color:var(--color-danger);">脚本加载失败: ' + (e.target.src || 'unknown') + '</p></div>';
      }
    }, true);
  </script>

  <!-- App Boot（模块脚本：从本地 import map 加载 vendored 的 supabase-js） -->
  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    window.supabase = { createClient };

    // Chain-load scripts in dependency order
    const scripts = [
      'js/data/client.js',
      'js/data/processes.js',
      'js/data/orders.js',
      'js/data/storage.js',
      'js/data/customers.js',
      'js/data/recognize.js',
      'js/data/exceptions.js',
      'js/data/production-records.js',
      'js/data/route-templates.js',
      'js/data/batches.js',
      'js/domain/order-state.js',
      'js/domain/node-state.js',
      'js/domain/validation.js',
      'js/domain/seq-calc.js',
      'js/domain/node-actions.js',
      'js/domain/order-create.js',
      'js/domain/batch-state.js',
      'js/components/status-badge.js',
      'js/components/progress-bar.js',
      'js/components/empty-state.js',
      'js/components/confirm-dialog.js',
      'js/components/toast.js',
      'js/components/login.js',
      'js/pages/order-list.js',
      'js/pages/dashboard.js',
      'js/pages/order-detail.js',
      'js/pages/order-create.js',
      'js/pages/exception-list.js',
      'js/pages/route-templates.js',
      'js/pages/batch-detail.js',
      'js/app.js'
    ];

    // 并行加载：这些文件都是 IIFE 脚本（只在被调用时引用其他全局），
    // 彼此无加载期依赖；原先的 onload 链式加载会让首屏变成 30+ 次串行往返。
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => {
          console.error('[Boot] Failed to load:', src);
          document.getElementById('page-container').innerHTML =
            '<div class="card" style="text-align:center;margin:48px;"><p style="font-size:2rem;">⚠️</p><p style="color:var(--color-danger);">加载失败: ' + src + '</p></div>';
          reject(new Error(src));
        };
        document.body.appendChild(s);
      });
    }

    function loadNext() {
      Promise.all(scripts.map(loadScript))
        .then(() => console.log('[Boot] All scripts loaded'))
        .catch(() => { /* 错误信息已显示在页面上 */ });
    }

    loadNext(0);
  </script>

  <!-- PWA 已于 2026-11-18 回滚：不再注册 Service Worker，并主动注销用户浏览器里
       残留的旧 SW + 清空其缓存（旧 SW 曾缓存静态资源，留着会继续返回旧页面）。
       发布目录里保留的 sw.js 已是 Kill Switch，用于覆盖安装并注销自身。 -->
  <script>
    if ('serviceWorker' in navigator) {
      // ① 注销所有已注册的 Service Worker
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) { registration.unregister(); }
      });

      // ② 清空旧 SW 留下的缓存（否则 Cache Storage 会残留几十 MB 且可能继续被命中）
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    }
  </script>
</body>
</html>
