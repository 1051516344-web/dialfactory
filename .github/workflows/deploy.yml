name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

# #12: cancel superseded runs to avoid concurrent deploy races
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pin action SHAs (supply-chain hardening)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # R5: stage ONLY the web assets — do not publish source, docs, or binaries
      # 注意：sw.js / manifest.webmanifest / icons 必须发布到 _site 根目录，
      # 否则 Service Worker 与 PWA 清单会 404，缓存无法生效。
      - name: Stage web assets
        run: |
          mkdir -p _site
          cp -r index.html css js sw.js manifest.webmanifest icons _site/

      # 关键资源存在性校验：缺任何一个都可能导致首屏白屏或 PWA 失效
      - name: Verify critical assets
        run: |
          test -f _site/index.html
          test -f _site/js/vendor/supabase.min.js
          test -f _site/sw.js
          test -f _site/manifest.webmanifest
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png

      - name: Enable GitHub Pages (auto-configure)
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
