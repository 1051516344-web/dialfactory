name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

# #12: cancel superseded runs to avoid concurrent deploy races
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Pin action SHAs (supply-chain hardening)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # R5: stage ONLY the web assets — do not publish source, docs, or binaries
      # PWA 已于 2026-11-18 回滚：不再发布 manifest.webmanifest / icons。
      # 但仍需发布 sw.js —— 它是 Kill Switch，用于覆盖安装并注销用户浏览器里残留的旧 SW；
      # 待确认线上客户端都清理完毕后，可再把 sw.js 从本行移除。
      - name: Stage web assets
        run: |
          mkdir -p _site
          cp -r index.html css js sw.js _site/

      # 关键资源存在性校验：缺任何一个都可能导致首屏白屏
      - name: Verify critical assets
        run: |
          test -f _site/index.html
          test -f _site/js/vendor/supabase.min.js
          test -f _site/sw.js
          test ! -f _site/manifest.webmanifest   # 确认已不再发布
          test ! -d _site/icons                  # 确认已不再发布

      - name: Enable GitHub Pages (auto-configure)
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
